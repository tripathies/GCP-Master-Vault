name: Deploy GCP learning catalogue

on:
  push:
    branches: [main]
    paths:
      - 'tracker/**'
      - '.github/workflows/deploy-gcp-learning.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gcp-learning-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload learning catalogue
        uses: actions/upload-pages-artifact@v3
        with:
          path: tracker
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
