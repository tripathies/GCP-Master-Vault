<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Google Cloud Architecture Playbook</title>
<desc id="desc">Conceptual Google Cloud enterprise reference architecture showing resource hierarchy, organization policies, identity, shared networking, production workloads, data and AI, security operations, and multi-region resilience.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07172c"/><stop offset=".55" stop-color="#0b2543"/><stop offset="1" stop-color="#050e1e"/></linearGradient>
 <linearGradient id="googleBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8ab4f8"/><stop offset=".5" stop-color="#4285f4"/><stop offset="1" stop-color="#174ea6"/></linearGradient>
 <linearGradient id="googleRed" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fda29b"/><stop offset=".55" stop-color="#ea4335"/><stop offset="1" stop-color="#a52714"/></linearGradient>
 <linearGradient id="googleYellow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff2a8"/><stop offset=".55" stop-color="#fbbc04"/><stop offset="1" stop-color="#d69200"/></linearGradient>
 <linearGradient id="googleGreen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a8e6b0"/><stop offset=".55" stop-color="#34a853"/><stop offset="1" stop-color="#137333"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#163a5d"/><stop offset="1" stop-color="#0a1c34"/></linearGradient>
 <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0H0V46" fill="none" stroke="#70b7ff" stroke-opacity=".11"/></pattern>
 <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78c7ff" stroke-width="1.5"/></marker>
 <style>
 text{font-family:Arial,Helvetica,sans-serif}.sec{font-size:16px;font-weight:800;letter-spacing:1px}.h{font-size:17px;font-weight:700;fill:#f5f9ff}.s{font-size:14px;fill:#c6ddf4}.muted{font-size:12px;fill:#a8c1dc}.flow{fill:none;stroke:#78c7ff;stroke-width:2;marker-end:url(#arr)}
 </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
<g opacity=".15" fill="none" stroke="#4285f4"><circle cx="1370" cy="95" r="280" stroke-dasharray="3 15"/><circle cx="1370" cy="95" r="225" stroke-dasharray="3 15"/></g>
<!-- Brand panel -->
<g>
 <text x="55" y="115" font-size="118" font-weight="900" letter-spacing="3" fill="url(#googleBlue)" filter="url(#glow)">G</text>
 <text x="142" y="115" font-size="118" font-weight="900" letter-spacing="3" fill="url(#googleRed)" filter="url(#glow)">C</text>
 <text x="235" y="115" font-size="118" font-weight="900" letter-spacing="3" fill="url(#googleGreen)" filter="url(#glow)">P</text>
 <text x="58" y="205" font-size="61" font-weight="900" fill="#edf5ff" letter-spacing="1">ARCHITECTURE</text>
 <text x="58" y="275" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="1">PLAYBOOK</text>
 <text x="62" y="342" font-size="27" font-weight="700" fill="#f3f8ff">From Cloud Fundamentals to</text>
 <text x="62" y="379" font-size="27" font-weight="700" fill="#8ab4f8">Enterprise-Grade Architecture</text>
 <rect x="54" y="425" width="650" height="57" rx="28" fill="#102c4c" stroke="#34a853" stroke-width="2.5" filter="url(#glow)"/>
 <text x="379" y="461" text-anchor="middle" font-size="22" font-weight="800" letter-spacing=".7" fill="#b8f5c5">END-TO-END GCP REFERENCE DESIGN</text>
 <rect x="56" y="530" width="648" height="245" rx="24" fill="#08182b" stroke="#4c9af2" stroke-width="2"/>
 <path d="M85 575H675M85 730H675" stroke="#3b7fbd" stroke-opacity=".45"/>
 <text x="88" y="615" font-size="23" font-weight="800" fill="#eaf4ff">GOOGLE CLOUD</text>
 <text x="88" y="650" font-size="18" fill="#b8d8f6">A practical path from foundations</text>
 <text x="88" y="677" font-size="18" fill="#b8d8f6">to secure, scalable cloud platforms.</text>
 <rect x="86" y="700" width="590" height="48" rx="24" fill="#0d3150" stroke="#70b7ff" stroke-width="1.8"/>
 <text x="381" y="730" text-anchor="middle" font-size="19" font-weight="800" letter-spacing="1.3" fill="#eff8ff">DESIGN  •  BUILD  •  SECURE  •  AUTOMATE</text>
 <text x="60" y="825" font-size="14" letter-spacing="2.5" fill="#8ebce5">OPEN-SOURCE GOOGLE CLOUD LEARNING VAULT</text>
 <text x="60" y="851" font-size="13" fill="#9eb7d1">Conceptual enterprise pattern • validate services and regional capabilities</text>
</g>
<!-- Main architecture canvas -->
<g>
 <rect x="735" y="28" width="820" height="840" rx="22" fill="#07182c" stroke="#4285f4" stroke-width="2.5" filter="url(#glow)"/>
 <text x="765" y="65" font-size="23" font-weight="900" fill="#eaf4ff">GOOGLE CLOUD ENTERPRISE REFERENCE ARCHITECTURE</text>
 <text x="1525" y="65" text-anchor="end" font-size="12" letter-spacing="1" fill="#91b9e1">MULTI-PROJECT • ZERO TRUST • RESILIENT DESIGN</text>
 <!-- global entry -->
 <rect x="760" y="86" width="770" height="92" rx="13" fill="#102b49" stroke="#8ab4f8" stroke-width="1.7"/>
 <text x="780" y="110" class="sec" fill="#9ec7ff">01  GLOBAL / EDGE ENTRY</text>
 <rect x="782" y="121" width="215" height="45" rx="8" fill="url(#panel)" stroke="#8ab4f8"/><text x="889" y="140" text-anchor="middle" class="h">Cloud DNS</text><text x="889" y="157" text-anchor="middle" class="muted">Zones • Routing policies</text>
 <path d="M1000 143H1035" class="flow"/>
 <rect x="1045" y="121" width="245" height="45" rx="8" fill="url(#panel)" stroke="#8ab4f8"/><text x="1167" y="140" text-anchor="middle" class="h">External Application LB</text><text x="1167" y="157" text-anchor="middle" class="muted">Global HTTPS • Cloud Armor</text>
 <path d="M1293 143H1320" class="flow"/>
 <rect x="1330" y="121" width="180" height="45" rx="8" fill="url(#panel)" stroke="#8ab4f8"/><text x="1420" y="140" text-anchor="middle" class="h">Cloud CDN</text><text x="1420" y="157" text-anchor="middle" class="muted">Edge caching</text>
 <!-- hierarchy -->
 <rect x="760" y="190" width="770" height="113" rx="13" fill="#2c2b22" stroke="#fbbc04" stroke-width="1.8"/>
 <text x="780" y="216" class="sec" fill="#ffdf83">02  RESOURCE HIERARCHY • LANDING ZONE</text>
 <rect x="780" y="230" width="170" height="58" rx="8" fill="#26364a" stroke="#fbbc04"/><text x="865" y="254" text-anchor="middle" class="h">Organization</text><text x="865" y="273" text-anchor="middle" class="muted">Policy root</text>
 <rect x="965" y="230" width="170" height="58" rx="8" fill="#26364a" stroke="#fbbc04"/><text x="1050" y="254" text-anchor="middle" class="h">Folders</text><text x="1050" y="273" text-anchor="middle" class="muted">Environment • Team</text>
 <rect x="1150" y="230" width="170" height="58" rx="8" fill="#26364a" stroke="#fbbc04"/><text x="1235" y="254" text-anchor="middle" class="h">Projects</text><text x="1235" y="273" text-anchor="middle" class="muted">Workload boundaries</text>
 <rect x="1335" y="230" width="175" height="58" rx="8" fill="#26364a" stroke="#fbbc04"/><text x="1422" y="254" text-anchor="middle" class="h">Billing &amp; Quotas</text><text x="1422" y="273" text-anchor="middle" class="muted">Budgets • Limits</text>
 <!-- security shared controls -->
 <rect x="760" y="315" width="770" height="91" rx="13" fill="#102b40" stroke="#34a853" stroke-width="1.7"/>
 <text x="780" y="340" class="sec" fill="#a8e6b0">03  SHARED SECURITY • IDENTITY • OPERATIONS</text>
 <rect x="780" y="352" width="170" height="43" rx="8" fill="#123a42" stroke="#34a853"/><text x="865" y="378" text-anchor="middle" class="h">Cloud IAM • IAP</text>
 <rect x="965" y="352" width="170" height="43" rx="8" fill="#123a42" stroke="#34a853"/><text x="1050" y="378" text-anchor="middle" class="h">Org Policy</text>
 <rect x="1150" y="352" width="170" height="43" rx="8" fill="#123a42" stroke="#34a853"/><text x="1235" y="378" text-anchor="middle" class="h">Cloud KMS • Secret Mgr</text>
 <rect x="1335" y="352" width="175" height="43" rx="8" fill="#123a42" stroke="#34a853"/><text x="1422" y="378" text-anchor="middle" class="h">SCC • Logs • Monitoring</text>
 <!-- production project -->
 <rect x="760" y="418" width="480" height="420" rx="14" fill="#10283e" stroke="#34a853" stroke-width="2"/>
 <path d="M774 418H1226Q1240 418 1240 432V459H760V432Q760 418 774 418Z" fill="#1b5338"/>
 <text x="780" y="446" font-size="20" font-weight="800" fill="#e8fff0">04  PRODUCTION PROJECT</text>
 <text x="1218" y="446" text-anchor="end" class="muted">ONLINE WORKLOADS</text>
 <rect x="780" y="472" width="440" height="91" rx="10" fill="url(#panel)" stroke="#65c98a"/><text x="800" y="497" class="h">Application &amp; Compute</text><text x="800" y="522" class="s">Compute Engine • Managed Instance Groups</text><text x="800" y="545" class="s">GKE Autopilot / Standard • Cloud Run</text>
 <rect x="780" y="576" width="440" height="82" rx="10" fill="url(#panel)" stroke="#65c98a"/><text x="800" y="601" class="h">Data &amp; Storage</text><text x="800" y="626" class="s">Cloud SQL HA • Spanner • Firestore</text><text x="800" y="647" class="s">Cloud Storage • Persistent Disk</text>
 <rect x="780" y="671" width="440" height="72" rx="10" fill="url(#panel)" stroke="#65c98a"/><text x="800" y="696" class="h">APIs &amp; Event-Driven Services</text><text x="800" y="723" class="s">API Gateway • Cloud Functions • Pub/Sub • Eventarc</text>
 <rect x="780" y="756" width="440" height="65" rx="10" fill="url(#panel)" stroke="#65c98a"/><text x="800" y="781" class="h">Delivery &amp; Private Networking</text><text x="800" y="805" class="s">Cloud Build • Artifact Registry • VPC • PSC • Cloud NAT</text>
 <!-- data AI project -->
 <rect x="1255" y="418" width="275" height="420" rx="14" fill="#172746" stroke="#8ab4f8" stroke-width="2"/>
 <path d="M1269 418H1516Q1530 418 1530 432V459H1255V432Q1255 418 1269 418Z" fill="#284d83"/>
 <text x="1275" y="446" font-size="19" font-weight="800" fill="#eef5ff">05  DATA &amp; AI PROJECT</text>
 <rect x="1275" y="472" width="235" height="95" rx="10" fill="#1d3456" stroke="#8ab4f8"/><text x="1392" y="498" text-anchor="middle" class="h">Analytics</text><text x="1392" y="524" text-anchor="middle" class="s">BigQuery • Dataflow</text><text x="1392" y="547" text-anchor="middle" class="s">Dataplex • Looker</text>
 <rect x="1275" y="580" width="235" height="105" rx="10" fill="#1d3456" stroke="#8ab4f8"/><text x="1392" y="607" text-anchor="middle" class="h">AI / ML Platform</text><text x="1392" y="633" text-anchor="middle" class="s">Vertex AI • Model Garden</text><text x="1392" y="657" text-anchor="middle" class="s">Pipelines • Feature Store</text><text x="1392" y="676" text-anchor="middle" class="muted">Governed data access</text>
 <rect x="1275" y="698" width="235" height="123" rx="10" fill="#1d3456" stroke="#8ab4f8"/><text x="1392" y="725" text-anchor="middle" class="h">Data Governance</text><text x="1392" y="751" text-anchor="middle" class="s">IAM • DLP • KMS</text><text x="1392" y="775" text-anchor="middle" class="s">Lineage • Audit • Policy</text><text x="1392" y="802" text-anchor="middle" class="muted">Security Command Center</text>
 <path d="M1241 618H1250" class="flow"/>
 <text x="1145" y="855" text-anchor="middle" font-size="13" fill="#9fc5e8">06  MULTI-REGION RESILIENCE • BACKUP • REPLICATION • FAILOVER</text>
</g>
</svg>