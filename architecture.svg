<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5f6b7a"/></marker></defs><rect width="1280" height="800" rx="18" fill="#f7f9fc"/><text x="640" y="44" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#183153">Google Cloud Enterprise Reference (Conceptual)</text><rect x="350" y="75" width="580" height="70" rx="12" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/><text x="640" y="104" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#174ea6">Organization • Folders • Projects • Billing</text><text x="640" y="128" text-anchor="middle" font-family="Arial" font-size="13" fill="#174ea6">Resource hierarchy, quotas, policies</text><rect x="55" y="190" width="1170" height="90" rx="12" fill="#fff" stroke="#8ab4f8" stroke-width="2"/><text x="640" y="222" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#174ea6">Identity &amp; Governance</text><text x="640" y="250" text-anchor="middle" font-family="Arial" font-size="14" fill="#3c4043">Cloud IAM • Service Accounts • Workload Identity Federation • Organization Policy • Audit Logs</text><path d="M640 145 V190" stroke="#5f6b7a" stroke-width="2" marker-end="url(#a)" fill="none"/><rect x="55" y="320" width="360" height="115" rx="12" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/><text x="235" y="350" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#137333">Networking &amp; Edge</text><text x="235" y="378" text-anchor="middle" font-family="Arial" font-size="14" fill="#202124">VPC • DNS • Load Balancing</text><text x="235" y="402" text-anchor="middle" font-family="Arial" font-size="14" fill="#202124">Cloud Armor • Private Connectivity</text><rect x="460" y="320" width="360" height="115" rx="12" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/><text x